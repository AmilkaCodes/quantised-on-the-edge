name: audit
on: [push]
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Recompute all 36 quality cells from the per-problem records
        run: |
          python irp/analysis/scripts/final_audit.py | tee audit.out
          grep -q 'PROBLEMS: 0' audit.out
