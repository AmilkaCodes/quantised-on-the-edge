# E2b config — imatrix-CALIBRATED rungs only (e2b-protocol.md). Study caps identical to the
# registered sweeps; the shared NAIVE F16 remains the baseline (not rerun here). Model names carry
# the -imat suffix so all output filenames stay distinct from the naive ladders.

device: "mac"
llama_cpp_tag: "b9951"
server_bin: "./local/llama.cpp/build/bin/llama-server"

host: "127.0.0.1"
port: 8080
n_ctx: 4096
seed: 0
temperature: 0.0
max_tokens: 768
manage_server: true
server_ready_timeout_s: 300

dataset: "humaneval"

models:
  - name: "qwen2.5-coder-1.5b-instruct-imat"
    gguf_dir: "./local/models/qwen2.5-coder-1.5b-instruct"
    ngl: 999
    quants:
      - {label: "Q4_K_M", file: "qwen2.5-coder-1.5b-instruct-imat-Q4_K_M.gguf"}
      - {label: "Q3_K_M", file: "qwen2.5-coder-1.5b-instruct-imat-Q3_K_M.gguf"}
      - {label: "Q2_K",   file: "qwen2.5-coder-1.5b-instruct-imat-Q2_K.gguf"}

  - name: "phi-3-mini-4k-instruct-imat"
    gguf_dir: "./local/models/phi-3-mini-4k-instruct"
    ngl: 999
    quants:
      - {label: "Q4_K_M", file: "phi-3-mini-4k-instruct-imat-Q4_K_M.gguf"}
      - {label: "Q3_K_M", file: "phi-3-mini-4k-instruct-imat-Q3_K_M.gguf"}
      - {label: "Q2_K",   file: "phi-3-mini-4k-instruct-imat-Q2_K.gguf"}
